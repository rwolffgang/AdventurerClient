name: Release

# Push a version tag (for example v1.2.0) to build the Windows installer and the
# macOS disk images and attach them to a GitHub release for that tag.
# Run it by hand from the Actions tab to build them without publishing a release;
# the files are then attached to the workflow run. Pull requests that change the
# packaging set-up also build them, so a broken build shows up before a release.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'src/package.json'
      - 'src/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: distwin
            files: src/distPackages/*.exe
          - name: macOS
            os: macos-latest
            script: distmac
            files: src/distPackages/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Use the tag as the app version
        if: github.ref_type == 'tag'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Create the release and upload the installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l packages
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/* --clobber
          else
            gh release create "$TAG" packages/* --title "$TAG" --generate-notes
          fi
