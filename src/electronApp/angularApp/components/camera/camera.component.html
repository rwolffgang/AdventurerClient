<div class="ac-card ac-camera-card">
  <div class="ac-camera-header">
    <div class="ac-section-title">Camera</div>
    <span *ngIf="CameraAvailable" class="ac-live-badge">
      <span class="ac-live-dot"></span>LIVE
    </span>
  </div>

  <div class="ac-camera-frame">
    <img *ngIf="CameraAvailable" #ImageElement class="ac-camera-feed" alt="Printer camera feed">
    <div *ngIf="!CameraAvailable" class="ac-camera-placeholder">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6" width="18" height="13" rx="2"></rect>
        <circle cx="12" cy="12.5" r="3.4"></circle>
        <path d="M8 6l1.6-2.2h4.8L16 6"></path>
      </svg>
      <span class="ac-mono ac-camera-placeholder-text">Camera unavailable</span>
      <a class="ac-camera-help" target="_blank" href="https://github.com/andycb/AdventurerClientJS/wiki/Using-The-Printer-Camera">Help</a>
    </div>
  </div>
</div>
